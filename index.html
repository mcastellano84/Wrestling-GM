<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1, user-scalable=no" />
<title>Booked — Wrestling GM</title>

<!-- Tailwind's runtime CDN build — compiles utility classes in the browser, no local build step needed -->
<script src="https://cdn.tailwindcss.com"></script>

<!-- Import map: lets the browser resolve bare specifiers like "react" and "lucide-react" straight from a CDN -->
<script type="importmap">
{
  "imports": {
    "react": "https://esm.sh/react@18.3.1",
    "react-dom/client": "https://esm.sh/react-dom@18.3.1/client?external=react",
    "lucide-react": "https://esm.sh/lucide-react@0.383.0?external=react"
  }
}
</script>

<!-- Babel Standalone: transforms the JSX in wrestling-gm.jsx into plain JS, right in the browser -->
<script src="https://unpkg.com/@babel/standalone@7.25.6/babel.min.js"></script>

<style>
  html, body { margin: 0; padding: 0; background: #EAE2CC; }
  #root:empty::before {
    content: 'Loading...';
    display: block;
    font-family: system-ui, sans-serif;
    color: #1B1712;
    text-align: center;
    padding: 40px;
  }
</style>
</head>
<body>
<div id="root"></div>

<!--
  window.storage polyfill: the game normally saves through an API that only
  exists inside Claude's own artifact preview. Outside of that, this backs it
  with localStorage instead, so progress actually persists on GitHub Pages.
-->
<script>
  if (!window.storage) {
    const prefix = 'wgm:';
    window.storage = {
      async get(key) {
        const raw = localStorage.getItem(prefix + key);
        if (raw === null) return null;
        return { key, value: raw, shared: false };
      },
      async set(key, value) {
        localStorage.setItem(prefix + key, value);
        return { key, value, shared: false };
      },
      async delete(key) {
        localStorage.removeItem(prefix + key);
        return { key, deleted: true, shared: false };
      },
      async list(p) {
        const keys = Object.keys(localStorage)
          .filter((k) => k.startsWith(prefix + (p || '')))
          .map((k) => k.slice(prefix.length));
        return { keys };
      },
    };
  }
</script>

<script type="module">
  try {
    const res = await fetch('./wrestling-gm.jsx');
    if (!res.ok) throw new Error('Could not find wrestling-gm.jsx next to this index.html (HTTP ' + res.status + ')');
    const source = await res.text();

    // Append a small mount step to the fetched source. `React` and `WrestlingGM`
    // are already in scope here because they're imported/exported at the top
    // of wrestling-gm.jsx itself — we're just appending, not replacing.
    const combined = source + `
import { createRoot } from 'react-dom/client';
createRoot(document.getElementById('root')).render(React.createElement(WrestlingGM));
`;

    const { code } = Babel.transform(combined, { presets: ['react'], sourceType: 'module' });
    const blob = new Blob([code], { type: 'text/javascript' });
    const url = URL.createObjectURL(blob);
    await import(url);
  } catch (err) {
    document.getElementById('root').innerHTML =
      '<pre style="padding:24px;color:#AC3A2C;white-space:pre-wrap;font-family:monospace;">Failed to load the game:\n' +
      (err && err.message ? err.message : err) +
      '</pre>';
    console.error(err);
  }
</script>
</body>
</html>
